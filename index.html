<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C6A4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one plain list per tab, like a paper checklist; tabs at the bottom; nothing else on screen. */
:root{
  --bg:#F6F7F4; --ink:#1B221E; --muted:#7A837D; --line:#E3E6E0;
  --accent:#2C6A4C; --accent-ink:#FFFFFF; --soft:#E4EFE8; --warn:#B4432C; --card:#FFFFFF; --tabfill:#ECEEE9;
  --display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --ink:#E7EBE5; --muted:#8E9891; --line:#262B28; --accent:#7CC49E; --accent-ink:#0E1A13; --soft:#1E3127; --warn:#E8826A; --card:#1B1F1C; --tabfill:#1A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --ink:#E7EBE5; --muted:#8E9891; --line:#262B28; --accent:#7CC49E; --accent-ink:#0E1A13; --soft:#1E3127; --warn:#E8826A; --card:#1B1F1C; --tabfill:#1A1D1B; color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:22px calc(120px + env(safe-area-inset-bottom,0px))}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-top:10px;margin-top:-10px}
.head .sub{margin-bottom:0;padding-bottom:10px}
.head:has(+ div),.head:has(+ ul){border-bottom:1px solid transparent}
h1{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:-.01em;margin:0 0 2px}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:14px;min-height:1.3em}

ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;padding:0;margin-top:1px;display:grid;place-items:center}
.tick::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent-ink);transform:scale(0);transition:transform .15s}
li.done .tick{background:var(--accent);border-color:var(--accent)}
li.done .tick::after{transform:scale(1)}
textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:2px 0;line-height:1.4;overflow:hidden;font-size:1.05rem;field-sizing:content}
textarea:focus{outline:none}
li.done textarea{color:var(--muted);text-decoration:line-through}
.del{display:none;flex:none;border:0;background:transparent;color:var(--warn);font-size:.9rem;font-weight:700;padding:3px 0}
li:focus-within .del{display:block}

li.add .tick{border-style:dashed;border-color:var(--line)}
li.add textarea::placeholder{color:var(--muted)}

.clear{margin-top:14px;border:0;background:transparent;color:var(--accent);font-weight:700;padding:4px 0}

/* day tabs */
.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:2px 0 4px}
.dtab{flex:1;min-width:0;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;background:var(--tabfill);padding:9px 0 9px;color:var(--muted);font-weight:700;font-size:.88rem;position:relative;margin-bottom:-1px}
.dtab[aria-selected="true"]{background:var(--bg);border-color:var(--line);color:var(--ink)}
.dtab.today::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.rtext{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:2px 0;font-size:1.05rem;line-height:1.4;overflow-wrap:anywhere}
li.done .rtext{color:var(--muted);text-decoration:line-through}
.tick:disabled{opacity:.3;cursor:default}
/* pop-up */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:16px;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet input{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font:inherit;font-size:1.05rem;color:var(--ink)}
.sheet input:focus{outline:none;border-color:var(--accent)}
.sheet .lbl{font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:-8px}
.dayset{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayset button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 0;font-weight:700;font-size:.85rem;color:var(--muted)}
.dayset button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .save{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:11px 26px;font-weight:700}
.remrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.remrow input{flex:none}
.calbtn{border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:11px 14px;font-weight:700;text-decoration:none}
.rtime{display:block;font-size:.85rem;color:var(--accent);font-weight:700;text-decoration:none}
.sheet .rm{border:0;background:transparent;color:var(--warn);font-weight:700;padding:6px 0}
/* off-day routine items */
.offlbl{margin-top:22px;padding-bottom:4px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
li.off{opacity:.45}
li.off .tick{border-style:dashed}
/* to-do groups */
.tlist{padding-left:0!important}
.tlist li{align-items:baseline;gap:10px}
.sno{flex:none;min-width:2.1em;text-align:right;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tlist li.add{padding-left:calc(2.1em + 10px)}
.tlist li.add .tick{display:none}
.later{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 0;font-weight:700;font-size:.9rem;color:var(--muted)}
.later[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* duplicate warning */
.backdrop.center{align-items:center;padding:0 24px}
.dupbox{border-radius:18px;max-width:380px;padding:20px!important;gap:10px}
.dupt{margin:0;font-family:var(--display);font-size:1.25rem}
.dupmsg{margin:0 0 6px;color:var(--ink);overflow-wrap:anywhere}
.rm.plain{color:var(--accent)}
/* collapse all */
.subrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.subrow .sub{flex:1;min-width:0}
.allbtn{flex:none;border:0;background:transparent;color:var(--accent);font-weight:700;font-size:.92rem;padding:4px 0}
/* search */
.titlebar .tright{display:flex;gap:8px;align-items:center}
.sbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.sbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.sbar{display:flex;gap:10px;align-items:center;padding-bottom:10px}
.sbar input{flex:1;min-width:0;border:1px solid var(--accent);background:var(--card);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
.sbar input:focus{outline:none}
.sbar button{flex:none;border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 0}
.sres{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0}
.sres b{display:block;font-weight:400;font-size:1.05rem;overflow-wrap:anywhere}
.sres span{display:block;color:var(--muted);font-size:.85rem}
.sres mark{background:var(--soft);color:inherit;border-radius:3px}
li.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--soft)}100%{background:transparent}}
/* small labels */
.meta{display:block;font-size:.82rem;color:var(--muted);font-weight:400}
.streak{display:inline-block;margin-left:8px;font-size:.85rem;color:var(--accent);font-weight:700;white-space:nowrap}
.rep{color:var(--accent)}
.colw{flex:1;min-width:0;display:flex;flex-direction:column}
.colw textarea{flex:none;width:100%}
/* buy again */
.again{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 14px 21px}
.again .lab{font-size:.8rem;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:.88rem;color:var(--ink)}
.chip::before{content:"+ ";color:var(--accent);font-weight:700}
/* repeat + week */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem;color:var(--muted);font-weight:700}
.week i{display:block;margin:4px auto 0;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.week i.y{background:var(--accent);border-color:var(--accent)}
.week i.n{border-color:var(--muted)}
.week i.x{border-style:dashed;opacity:.5}
.week i.f{opacity:.35}
/* badges, quick add, all done */
nav button{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.alldone{margin:4px 0 6px;padding:12px 14px;border-radius:14px;background:var(--soft);color:var(--accent);font-weight:700}
.qsel{display:flex;flex-wrap:wrap;gap:6px}
.qsel button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:700;font-size:.88rem;color:var(--muted)}
.qsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.plus{font-size:1.5rem;line-height:1;color:var(--accent);font-weight:400}
/* offline bar */
.net{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:19;
  background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:700;max-width:calc(100% - 36px);text-align:center}
/* swipe to delete */
li.swipe{touch-action:pan-y;position:relative;background:var(--bg);transition:transform .16s}
li.swipe.arm{box-shadow:inset -4px 0 0 var(--warn)}
li.swipe.arm::after{content:"Delete";position:absolute;left:100%;top:50%;transform:translateY(-50%);padding-left:16px;color:var(--warn);font-weight:700}
li.swipe.gone{opacity:0;transition:transform .16s,opacity .16s}
ul:has(li.swipe){overflow-x:clip}
/* reorder */
.grip{flex:none;align-self:center;width:34px;height:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;touch-action:none;cursor:grab}
.grip i{display:block;width:16px;height:2px;border-radius:2px;background:var(--muted);opacity:.45}
li.dragging{position:relative;z-index:5;background:var(--soft);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
li.shifting{transition:transform .15s}
body.noselect{user-select:none;-webkit-user-select:none}
/* shopping lists */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.addlist{flex:none;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:9px 14px;font-weight:700}
.grp{border-bottom:1px solid var(--line)}
.grp-row{display:flex;align-items:center;gap:6px}
.grp-head{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:15px 0;text-align:left}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.grp.open .chev{transform:rotate(45deg)}
.grp-title{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.grp-count{flex:none;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.grp-more{flex:none;border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:38px;height:38px;border-radius:10px;line-height:1}
.grp ul{padding-left:21px;margin-bottom:10px}
.grp li:last-child{border-bottom:0}
/* notes */
.note-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:13px 0}
.note-row b{display:block;font-size:1.05rem;overflow-wrap:anywhere}
.note-row span{display:block;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new{margin-top:14px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 18px;font-weight:700}
.back{border:0;background:transparent;color:var(--accent);font-weight:700;padding:4px 0;margin-bottom:10px}
.page{display:block;width:100%;min-height:60vh;border:0;background:transparent;font-size:1.05rem;line-height:1.55;resize:none;padding:0;overflow:auto;field-sizing:fixed}
.note-foot{display:flex;justify-content:flex-end;margin-top:12px}
.note-foot button{border:0;background:transparent;color:var(--warn);font-weight:700;padding:4px 0}

.empty{color:var(--muted);padding:12px 0 4px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
nav div{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
nav button{border:0;background:transparent;border-radius:16px;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-weight:700;font-size:.8rem}
nav button svg{width:24px;height:24px}
nav button svg *{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{background:var(--soft);color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:.95rem;max-width:calc(100% - 36px)}
.toast button{border:0;background:transparent;color:var(--soft);font-weight:700;padding:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
/* page reset (stands in for the artifact wrapper) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* sign-in screen */
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.login h1{font-family:var(--display);font-size:2.2rem;margin:0}
.login p{margin:0;color:var(--muted);max-width:30ch}
.gbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 20px;font:inherit;font-weight:700;font-size:1rem;display:flex;gap:10px;align-items:center}
.gbtn svg{width:20px;height:20px}
.login .err{color:var(--warn);font-weight:700}
.who-foot{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who-foot button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0;font:inherit;font-size:.85rem}
</style>
</head>
<body>


<div class="login" id="login">
  <h1>Family Daybook</h1>
  <p id="login-msg">Routine, to-dos, notes and the family shopping list.</p>
  <button class="gbtn" id="gsign" type="button"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>
  <p class="err" id="login-err" hidden></p>
</div>
<main id="main"></main>

<nav aria-label="Lists"><div role="tablist">
  <button role="tab" data-tab="routine"><span class="badge" hidden></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Routine</button>
  <button role="tab" data-tab="todo"><span class="badge" hidden></span><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>To-do</button>
  <button role="tab" data-tab="notes"><svg viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h6M9 16h4"/></svg>Notes</button>
  <button role="tab" data-tab="shopping"><span class="badge" hidden></span><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.3 11.5H6.3z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>Shopping</button>
</div></nav>

<div class="backdrop" id="pop" hidden>
  <form class="sheet" id="pop-form" role="dialog" aria-label="Routine item" autocomplete="off">
    <input id="pop-text" type="text" aria-label="Name">
    <div class="lbl">Which days?</div>
    <div class="dayset" id="pop-days"></div>
    <div class="lbl" id="pop-wlbl">This week</div>
    <div class="week" id="pop-week"></div>
    <div class="lbl">Reminder time (optional)</div>
    <div class="remrow"><input id="pop-time" type="time" aria-label="Reminder time"><a id="pop-cal" class="calbtn" href="#" target="_blank" rel="noopener" hidden>Add reminder to phone</a></div>
    <div class="sheet-bar"><button class="rm" type="button" id="pop-del">Delete</button><button class="save" type="submit">Save</button></div>
  </form>
</div>
<div class="backdrop" id="tpop" hidden>
  <form class="sheet" id="tpop-form" role="dialog" aria-label="To-do" autocomplete="off">
    <input id="tpop-text" type="text" aria-label="Name">
    <div class="lbl">Repeat</div>
    <div class="seg" id="tpop-rep"><button type="button" data-r="">No</button><button type="button" data-r="month">Monthly</button><button type="button" data-r="year">Yearly</button></div>
    <div id="tpop-repwrap" hidden style="display:flex;flex-direction:column;gap:8px"><div class="lbl" id="tpop-replbl">Due on</div><input id="tpop-date" type="date" aria-label="Due date"></div>
    <div id="tpop-movewrap" style="display:flex;flex-direction:column;gap:16px">
    <div class="lbl">Move to</div>

const TITLES={routine:'Routine',todo:'To-do',notes:'Notes',shopping:'Shopping'};

let tab='routine', openNote=null, selDay=new Date().getDay();

const onDay=(o,d)=>!o.days||o.days.includes(d);

const k2d=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

      put({...cur,doneOn:was?null:today,hist:H})}}),
    h('button',{class:'rtext',type:'button',onclick:()=>openPop(o.id)},o.text,(n=>n>=2?h('span',{class:'streak'},'🔥 '+n):null)(streak(o)),o.time?h('span',{class:'rtime'},'⏰ '+fmtT(o.time)):null),

let dragging=false;

function shopRow(o){

const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9\u0900-\u0fff]+/g,'');

  if(o.list==='todo')return 'To-do ('+(o.rep?'Repeating':o.when==null?'Long term':DFULL[o.when])+')';
  if(o.list==='note')return 'Notes';

  if(o.list==='routine')return 'Routine';return ''}

    oninput:e=>grow(e.target),

    onblur:e=>commit(e.target,false)});
  function commit(t,keep){const v=t.value.trim();if(!v||dupOpen)return;

      const o={id:newId(),list,text:v,done:false,doneOn:null,created:Date.now()};if(list==='todo'){o.when=group==='later'?null:+String(group).slice(1)}else if(group)o.group=group;
      if(list==='shop'){if(myId)o.by=myId;const old=[...items.values()].find(x=>x.list==='shop'&&x.archived&&norm(x.text)===norm(v));

function badges(){

function render(){

    if(loose.length)secs.push(sec('_other','Other',loose,null));

  const go=()=>{if(list==='shop'){const old=[...items.values()].find(x=>x.list==='shop'&&x.archived&&norm(x.text)===norm(v));
      if(old){put({...old,archived:false,done:false,group:qTo,by:myId||old.by,created:Date.now()});toast('Added to '+where);return}}
    put(o);toast('Added to '+where)};
  closeQuick();const twin=findDup(list,v);if(twin)askDup(twin,go,()=>{});else go()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('spop').hidden)closeShop();if(!$('qpop').hidden)closeQuick()}});
/* ---------- tabs ---------- */
const TABS=['routine','todo','notes','shopping'];
function show(t){tab=TABS.includes(t)?t:'routine';if(tab!=='notes')openNote=null;render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(document.activeElement)document.activeElement.blur();location.hash=b.dataset.tab;show(b.dataset.tab)});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

/* new day: routine ticks clear */
function checkDay(){const k=dkey();if(k!==today){today=k;selDay=new Date().getDay();render()}}
setInterval(checkDay,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});

/* ---------- boot ---------- */
let startTab=location.hash.slice(1);if(!startTab){try{startTab=localStorage.getItem('daybook.tab')||''}catch(e){}}
show(startTab);
const login=$('login'), lerr=$('login-err');
$('gsign').onclick=async()=>{lerr.hidden=true;const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,prov)}catch(e){const c=e&&e.code||'';
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await signInWithRedirect(auth,prov)}catch(e2){lerr.textContent='Sign-in failed. Try again.';lerr.hidden=false}}
    else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){lerr.textContent='Sign-in failed ('+c+'). Try again.';lerr.hidden=false}}};
getRedirectResult(auth).catch(()=>{});
let unsubs=[];
window.daybookSignOut=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
  unsubs.forEach(u=>u());unsubs=[];
  if(!user){myId=null;items=new Map();mode='loading';login.hidden=false;return}
  myId=user.uid;myName=(user.displayName||'').split(' ')[0]||user.email;window.daybookUser={name:user.displayName,email:user.email};
  login.hidden=true;
  let pm=new Map(), sm=new Map(), sReady=false;
  const merge=()=>{items=new Map([...pm,...sm]);render();netBar()};
  const denied=e=>{if(e&&e.code==='permission-denied'){login.hidden=false;lerr.textContent=user.email+' is not on the family list yet. Ask PG to add it.';lerr.hidden=false;signOut(auth)}else toast('Connection problem. Your changes are kept on this phone.')};
  unsubs.push(onSnapshot(collection(fdb,'users',myId,'items'),{includeMetadataChanges:true},snap=>{
    pendP=snap.metadata.hasPendingWrites;mode='cloud';
    const m=new Map();snap.docs.forEach(d=>{const o=d.data();if(o&&o.list&&!SHARED.has(o.list))m.set(d.id,{...o,id:d.id})});pm=m;merge()},denied));
  unsubs.push(onSnapshot(collection(fdb,'shopping'),{includeMetadataChanges:true},snap=>{
    pendS=snap.metadata.hasPendingWrites;
    const m=new Map();snap.docs.forEach(d=>{const o=d.data();if(o&&o.list){m.set(d.id,{...o,id:d.id});sharedIds.add(d.id)}});sm=m;sReady=true;if(mode==='cloud')merge()},denied));
});
/* one-time import from the old Daybook (used during the move) */
window.daybookImport=async(privateDocs,sharedDocs)=>{if(!myId)throw new Error('sign in first');let n=0;
  const all=[...privateDocs.map(o=>[doc(fdb,'users',myId,'items',o.id),o]),...sharedDocs.map(o=>[doc(fdb,'shopping',o.id),o])];
  for(let i=0;i<all.length;i+=400){const b=writeBatch(fdb);all.slice(i,i+400).forEach(([r,o])=>{const c={...o};delete c.id;b.set(r,c);n++});await b.commit()}
  return n};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
