<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Family Expenses look. Fixed header, white rounded cards for every list, uppercase section labels, full-width bottom bar. */
:root{
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#15171C; --sub:#5E6470; --faint:#9A9FA8;
  --line:#E6E4DE; --line2:#F0EEE9; --seg:#E9E7E1;
  --accent:#0E5E5A; --accent-ink:#0A4845; --accent-bg:#E2F0EF; --on-accent:#FFFFFF;
  --ok:#127A4A; --ok-bg:#E3F3EA; --warn:#8A5200; --warn-bg:#FFF1D9; --neg:#B3261E; --neg-bg:#FFF5F4;
  --scrim:rgba(21,23,28,.45);
  --muted:var(--sub); --soft:var(--accent-bg);
  --num:"Bricolage Grotesque", Figtree, system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:var(--body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#181B21; --ink:#ECEDEF; --sub:#A2A7B1; --faint:#6E737C; --line:#262A32; --line2:#20242B; --seg:#22262D;
  --accent:#3FB7AE; --accent-ink:#7FD6CE; --accent-bg:#123331; --on-accent:#06201F;
  --ok:#5ED3A0; --ok-bg:#16302A; --warn:#F0B44C; --warn-bg:#33280F; --neg:#FF8A80; --neg-bg:#3A1D1B; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#181B21; --ink:#ECEDEF; --sub:#A2A7B1; --faint:#6E737C; --line:#262A32; --line2:#20242B; --seg:#22262D;
  --accent:#3FB7AE; --accent-ink:#7FD6CE; --accent-bg:#123331; --on-accent:#06201F;
  --ok:#5ED3A0; --ok-bg:#16302A; --warn:#F0B44C; --warn-bg:#33280F; --neg:#FF8A80; --neg-bg:#3A1D1B; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,li,.chip{touch-action:manipulation}
textarea,input,select{font-size:16px!important}
body{font-family:var(--body);font-size:15px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:480px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding:18px 20px 10px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{white-space:nowrap;font-family:var(--body);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;line-height:1.15}
.sub{color:var(--sub);font-size:14px;min-height:1.3em;margin-top:2px}
.subrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.subrow .sub{flex:1;min-width:0}
.allbtn{flex:none;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.titlebar .tright{display:flex;gap:8px;align-items:center}
.sbtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.sbtn svg{width:19px;height:19px}
.sbtn.plus{color:var(--accent)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;padding:0}
.addlist{flex:none;height:40px;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:12px;padding:0 12px;font-weight:600;font-size:14px}

/* segmented day picker */
.dtabs{display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--seg);margin-top:12px}
.dtab{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-weight:600;font-size:13px;position:relative;padding:0}
.dtab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dtab.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}

/* section labels */
.label,.offlbl{margin:20px 20px 8px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);display:flex;justify-content:space-between;align-items:baseline}

/* cards and rows */
ul{list-style:none;margin:0;padding:0}
main>ul,main>div>ul,.card{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;background:var(--card)}
li+li{border-top:1px solid var(--line2)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:transparent;padding:0;display:grid;place-items:center}
.tick::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--on-accent);border-bottom:2.5px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
li.done .tick{background:var(--accent);border-color:var(--accent)}
li.done .tick::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.tick:disabled{opacity:.3;cursor:default}
.rtext{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:4px 0;font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere;color:var(--ink)}
li.done .rtext,li.done textarea{color:var(--faint);text-decoration:line-through}
textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:4px 0;line-height:1.35;overflow:hidden;font-size:15px;field-sizing:content}
textarea:focus{outline:none}
.del{display:none}
li.add .tick{border-style:dashed;border-color:var(--line)}
li.add textarea::placeholder{color:var(--faint)}
.meta{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:1px}
.streak{display:inline-block;margin-left:8px;font-size:12px;color:var(--warn);font-weight:700;white-space:nowrap}
.rtime{display:block;font-size:12px;color:var(--accent);font-weight:600;text-decoration:none;margin-top:1px}
.rep{color:var(--accent)}
.colw{flex:1;min-width:0;display:flex;flex-direction:column}
.colw textarea{flex:none;width:100%}
.sno{flex:none;min-width:1.6em;text-align:right;color:var(--faint);font-size:13px;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums}
.tlist li.add{padding-left:calc(14px + 1.6em + 12px)}
.tlist li.add .tick{display:none}
li.off{opacity:.5}
li.off .tick{border-style:dashed}
.alldone{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:14px}
.empty{padding:22px 20px;text-align:center;color:var(--sub);font-size:14px}
.clear,.more-btn{display:block;width:calc(100% - 32px);margin:10px 16px 0;height:44px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px}

/* collapsible groups */
.grp{margin:16px 16px 0}
.grp-row{display:flex;align-items:center;gap:4px;padding:0 4px 8px}
.grp-head{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 0;text-align:left}
.chev{flex:none;width:7px;height:7px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:rotate(-45deg);transition:transform .15s}
.grp.open .chev{transform:rotate(45deg)}
.grp-title{flex:1;min-width:0;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sub);overflow-wrap:anywhere}
.grp-count{flex:none;color:var(--ink);font-family:var(--num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.grp-more{flex:none;border:0;background:transparent;color:var(--faint);font-size:18px;width:32px;height:28px;border-radius:8px;line-height:1;padding:0}
.grp ul{margin:0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.grp:not(.open) .grp-row{padding-bottom:0}

/* chips */
.again,.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.again{padding:10px 4px 0}
.again .lab{font-size:12px;color:var(--sub);font-weight:700;margin-right:2px;text-transform:uppercase;letter-spacing:.04em}
.chip{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.again .chip::before{content:"+ ";color:var(--accent);font-weight:700}
.chip.more{border-style:dashed;color:var(--sub);font-weight:500}
.chips.pad{padding:0 16px}

/* bottom sheets */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet input{height:48px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px;font-size:16px;color:var(--ink)}
.sheet input:focus{outline:none;border-color:var(--accent)}
.sheet .lbl{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:-6px}
.dayset{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayset button,.seg button,.later{height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0;font-weight:600;font-size:13px;color:var(--sub)}
.dayset button[aria-pressed="true"],.seg button[aria-pressed="true"],.later[aria-pressed="true"]{border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qsel{display:flex;flex-wrap:wrap;gap:8px}
.qsel button{height:36px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;font-weight:600;font-size:14px;color:var(--ink)}
.qsel button[aria-pressed="true"]{border:1.5px solid var(--accent);background:var(--accent-bg);color:var(--accent-ink)}
.sheet-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.sheet .save{height:48px;border:0;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:0 28px;font-weight:700;font-size:15px}
.sheet .rm{height:48px;border:1px solid var(--line);background:var(--neg-bg);color:var(--neg);border-radius:14px;padding:0 16px;font-weight:600;font-size:14px}
.rm.plain{background:var(--card);color:var(--accent)}
.remrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.remrow input{flex:none}
.calbtn{height:48px;display:inline-flex;align-items:center;border:1.5px solid var(--accent);color:var(--accent);border-radius:14px;padding:0 14px;font-weight:600;text-decoration:none}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--sub);font-weight:600}
.week i{display:block;margin:6px auto 0;width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.week i.y{background:var(--accent);border-color:var(--accent)}
.week i.n{border-color:var(--faint)}
.week i.x{border-style:dashed;opacity:.5}
.week i.f{opacity:.35}
.backdrop.center{align-items:center;padding:0 24px}
.dupbox{border-radius:20px;max-width:380px;padding:20px!important;gap:10px}
.dupt{margin:0;font-size:20px}
.dupmsg{margin:0 0 6px;color:var(--ink);overflow-wrap:anywhere}

.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
/* search */
.sbar{display:flex;gap:10px;align-items:center;margin-top:12px}
.sbar input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font-size:15px;color:var(--ink)}
.sbar input:focus{outline:none;border-color:var(--accent)}
.sbar button{flex:none;border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0}
#sbox{margin:4px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
#sbox:has(.empty:only-child){background:transparent;border:0}
.sres{display:block;width:100%;text-align:left;border:0;background:var(--card);padding:10px 14px;min-height:56px}
.sres+.sres{border-top:1px solid var(--line2)}
.sres b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.sres span{display:block;color:var(--sub);font-size:12px}
.sres mark{background:var(--accent-bg);color:inherit;border-radius:3px}
li.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-bg)}100%{background:var(--card)}}

/* swipe + reorder */
li.swipe{touch-action:pan-y;position:relative;transition:transform .16s}
li.swipe.arm{box-shadow:inset -4px 0 0 var(--neg)}
li.swipe.arm::after{content:"Remove";position:absolute;left:100%;top:50%;transform:translateY(-50%);padding-left:16px;color:var(--neg);font-weight:700}
li.swipe.gone{opacity:0;transition:transform .16s,opacity .16s}
.grip{flex:none;width:30px;height:32px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;touch-action:none;cursor:grab}
.grip i{display:block;width:14px;height:2px;border-radius:2px;background:var(--faint);opacity:.6}
li.dragging{position:relative;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.14)}
li.shifting{transition:transform .15s}
body.noselect{user-select:none;-webkit-user-select:none}

/* notes */
.note-row{display:block;width:100%;text-align:left;border:0;background:var(--card);padding:12px 14px;min-height:60px}
.note-row+.note-row{border-top:1px solid var(--line2)}
.note-row b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.note-row span{display:block;color:var(--sub);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{height:40px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:15px;padding:0}
.notedel{height:40px;border:1px solid var(--line);background:var(--neg-bg);color:var(--neg);border-radius:12px;padding:0 14px;font-weight:600;font-size:14px}
.notecard{padding:14px}
.page{display:block;width:100%;min-height:55vh;border:0;background:transparent;line-height:1.55;resize:none;padding:0;overflow:auto;field-sizing:fixed}
/* bottom bar */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav div{display:grid;grid-template-columns:repeat(5,1fr)}
nav button{position:relative;height:64px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--sub);font-weight:600;font-size:11px;padding:0}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;width:calc(100% - 32px);max-width:448px;
  background:#15171C;color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{border:0;background:transparent;color:#7FD6CE;font-weight:700;padding:0 4px}
.net{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:19;
  background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>
/* page reset (stands in for the artifact wrapper) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* sign-in screen */
.login{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.login h1{font-family:var(--display);font-size:2.2rem;margin:0}
.login p{margin:0;color:var(--muted);max-width:30ch}
.gbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 20px;font:inherit;font-weight:700;font-size:1rem;display:flex;gap:10px;align-items:center}
.gbtn svg{width:20px;height:20px}
.login .err{color:var(--warn);font-weight:700}
.who-foot{margin-top:28px;color:var(--muted);font-size:.85rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who-foot button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0;font:inherit;font-size:.85rem}
</style>
</head>
<body>


<div class="login" id="login" hidden>
  <h1>Family Daybook</h1>
  <p id="login-msg">Routine, to-dos, notes and the family shopping list.</p>
  <button class="gbtn" id="gsign" type="button"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>Sign in with Google</button>
  <p class="err" id="login-err" hidden></p>
</div>
<main id="main"></main>

<nav aria-label="Lists"><div role="tablist">
  <button role="tab" data-tab="routine"><span class="badge" hidden></span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Routine</button>
